<!DOCTYPE html>
<html lang="de">
<head>
    <title>Super wichtige Zwischeninstanz</title>
    <meta name="author" content="&Eacute;mile Jeremias Ruff">        
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../favicon.ico">
    
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'Lora';
            src: url('m/Lora.ttf') format('truetype');
        }
        
        body {
            font-family: 'Lora';            
            background-image: url("b/bg_kat.png");
            background-size: cover;
            background-position: center;
            margin: 0;
            padding: 0;
            background-color: rgba(0, 0, 0, 0.3);
            justify-content: center;
            text-align: center;   
            align-items: center;
        }
        
        main {
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            padding: 20px 40px;
            margin: 0;
        }
        
        select {
            margin-left: 10px;
            padding: 0px 10px;
            outline: none;
            border: 1px solid black;
            border-radius: 8px;
            height: 2rem;
            font-size: 15px;
        }
        
        a {
            color: inherit;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            body {
                background-image: url("b/bg_kat.png");
            }
            
            p {
                width: 70%;
                margin-top: -90%;
                line-height: 1.5rem;
            }
        }
    </style>
</head>

<main>
    <!--p>Bitte wählen Sie ein Jahr aus, zu dessen Pinnwand Sie weitergeleitet werden möchten:</p-->
    <select>
        <option>Jahr w&auml;hlen</option>
        <option title="Weiterleitung zu taskcards.de">2026</option>
    </select>
</main>

<script>
let jahr = "";
const links = {
    2026: "https://www.taskcards.de/#/board/78095455-4597-415c-9606-f54fc0666ac3?token=cea15406-fb6a-44a1-beb7-fde71eb76e31"
};

jahr = new URLSearchParams(window.location.search).get('jahr'); 
if (jahr && links[jahr]) {
    window.location.href = links[jahr];
} else {
    window.location.href = links[2026]; // bei noch nur einem Jahr
}

const select = document.querySelector("select");
select.addEventListener("change", () => {
    jahr = select.value;

    if (jahr === "Jahr wählen") { return };
    window.location.href = links[jahr];
});
</script>

</html>
