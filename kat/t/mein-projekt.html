function formatZeit(zeit) {
    const [stunden, minuten] = zeit.substring(0, 5).split(":");

    if (minuten === "00") {
        return stunden;
    }

    return `${stunden}:${minuten}`;
}

let projekte = {};
let projektMap = {};
let profil = {};

async function ladeDaten() {
    // Profil

async function ladeProjekt() {
    const tbody = document.querySelector("#projekt tbody");
    tbody.innerHTML = "";

    schueler.forEach(s => {
        const tr = document.createElement("tr");
        const projekt = projektMap[s.zugeordnet];
        tr.innerHTML = `
            <td>${s.id}</td>
            <td>${s.klasse}</td>
            <td>${s.name}</td>
            <td class="mail" data-mail="${s.mail ?? ""}" title="Klicken zum Kopieren">${s.mail}</td>
            <!--td>${projekt.id} - ${projekt.titel}</td-->
        `
        tbody.appendChild(tr);
        
        const zelle = tr.querySelector(".mail");
        zelle.style.cursor = "pointer";
        zelle.addEventListener("click", async () => {
            const mail = zelle.dataset.mail;
            if (!mail) return;

            await navigator.clipboard.writeText(mail);

            zelle.textContent = "Kopiert ✓";
            zelle.title = "E-Mail wurde kopiert";

            setTimeout(() => {
                zelle.textContent = mail;
                zelle.title = "Klicken zum Kopieren";
            }, 3000);
        });
    });
}

function kuerze(text, max) {
    text = String(text ?? "");

    return text.length > max
        ? text.slice(0, max - 3) + "..."
        : text;
}

async function downloadAsPdf() {
    await ladeDaten();
    try{
        const loader = document.getElementById("loader");
        loader.style.display = "block";

        const { generate } = await import("https://esm.sh/@pdfme/generator");
        const { table, text } = await import("https://esm.sh/@pdfme/schemas");

        // Schueler laden
        const {
            data,
            error
        } = await client

            .from("kat_sus")
            .select(`
                id,
                klasse,
                name,
                mail,
                zugeordnet
            `)
            .eq("zugeordnet", profil.projekt)
            .order("id")
            .order("name");

        if(error){
            throw error;
        }        

        const { data: projekteData, error: projekteError } = await client
            .from("kat_projekte")
            .select("id, titel")
            .order("id");

        if (projekteError) {
            throw projekteError;
        }

        const projekte = {};

        projekteData.forEach(p => {
            projekte[String(p.id)] = p.titel;
        });

        // Tabellenzeilen erzeugen
        const tableRows = data.map(s => [
            kuerze(s.klasse, 10),
            kuerze(s.name, 20),
            kuerze(s.mail, 20)
        ]);

        console.log("Anzahl Schueler:", tableRows.length);

        // Template auswählen
        const templateName =
            tableRows.length > 33
                ? "../m/template_projekt_2.json"
                : "../m/template_projekt.json";

        console.log("Template:", templateName);
        const template = await fetch(templateName).then(r => r.json());

        // Tabellen aufteilen
        const table1 = tableRows.slice(0,33);
        const table2 = tableRows.slice(33);

        const datum =  new Date().toLocaleDateString("de-DE");
        const projekt = projektMap[profil.projekt];
        const input = {
            header: `Schülerübersicht Klimaaktionstag, Projekt: ${profil.projekt} - ${projekt.titel}, Stand: ${datum}`,
            table: table1
        };

        // Nur für template_2
        if(table2.length){
            input.table_2 = table2;
        }

        const pdf = await generate({
            template,
            inputs:[input],

            plugins:{
                table,
                text
            }
        });

        const blob =
            new Blob(
                [
                    pdf
                ],

                {
                    type: "application/pdf"
                }
            );

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const date = new Date();
        const yy = String(date.getFullYear()).slice(2);
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        const datum2 = `${yy}-${mm}-${dd}`;

        a.href = url;
        a.download = `kat_${profil.projekt}_${datum2}.pdf`;

        a.click();
        URL.revokeObjectURL(url);
    }

    catch(error){
        console.error(error);
        alert(error.message);
    }

    finally{
        document.getElementById("loader").style.display = "none";
    }
    
}

let XLSX = null;
async function getXLSX() {
    if (!XLSX) {
        XLSX = await import("https://esm.sh/xlsx");
    }

    return XLSX;
}

async function downloadAsExcel() {
    await ladeDaten();
    const XLSX = await getXLSX();
    const table = document.getElementById("projekt");
    const workbook = XLSX.utils.table_to_book(table, {sheet: "Schueler"});
    const date = new Date();
    const yy = String(date.getFullYear()).slice(2);
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    const datum2 = `${yy}-${mm}-${dd}`;

    XLSX.writeFile(
        workbook,
        `kat_${profil.projekt}_${datum2}.xlsx`
    );
}

async function downloadAsOds() {
    await ladeDaten();
    const XLSX = await getXLSX();
    const table = document.getElementById("projekt");
    const workbook = XLSX.utils.table_to_book(table, {sheet: "Schueler"});
    const date = new Date();
    const yy = String(date.getFullYear()).slice(2);
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const dd = String(date.getDate()).padStart(2, '0');
    const datum2 = `${yy}-${mm}-${dd}`;

    XLSX.writeFile(
        workbook,
        `kat_${profil.projekt}_${datum2}.ods`,
        {
            bookType: "ods"
        }
    );
}
