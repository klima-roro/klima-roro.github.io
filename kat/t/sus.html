const lightbox = document.getElementById("lightbox");
document.getElementById("openLightbox").onclick = () => {
    if (getComputedStyle(lightbox).display === "none") {
        lightbox.style.display = "block";
    }
}

lightbox.onclick = (e) => {
    if (e.target === lightbox) {
        lightbox.style.display = "none";
    }
}

    document.querySelector("main").style.display = "none";

    document.querySelector("main").style.display = "block";
    document.getElementById("mobile").style.display = "none";

let modus = "view";

const viewBtn = document.getElementById("viewBtn");
const editBtn = document.getElementById("editBtn");
const newBtn = document.getElementById("new");
const saveBtn = document.getElementById("saveBtn");

const fieldTypes = {
    titel: "text",
    stufe_min: "number",
    stufe_max: "number",
    plaetze: "number",
    belegt: "number",
    frei: "number",
    durchfuerende: "text",
    lehrkraft: "text",
    ort: "text",
    startzeit: "time",
    endzeit: "time",
    materialien: "text",
    kontakt: "text"
};

function updateButtons() {
    if (modus === "view") {
        viewBtn.style.backgroundColor = "rgba(255,255,255,0.1)";
        editBtn.style.backgroundColor = "transparent";
        newBtn.style.display = "none";
        saveBtn.style.display = "none";

        document.querySelectorAll("#sus tbody td[data-field]").forEach(td => {
            if (td.dataset.field === "id")
                return;

            const input = td.querySelector("input");

            if (input) {
                td.textContent = input.value;
            }
        });

    } else {
        viewBtn.style.backgroundColor = "transparent";
        editBtn.style.backgroundColor = "rgba(255,255,255,0.1)";
        newBtn.style.display = "block";
        saveBtn.style.display = "block";

        document.querySelectorAll("#sus tbody td[data-field]").forEach(td => {
            const field = td.dataset.field;

            if (field === "id")
                return;

            const value = td.textContent;
            td.innerHTML = "";

            if (field === "zugeordnet") {
                const select = document.createElement("select");
                const leer = document.createElement("option");
                leer.value = "";
                leer.textContent = "";
                select.appendChild(leer);

                Object.entries(projekte).forEach(([id, titel]) => {
                    const option = document.createElement("option");
                    option.value = id;
                    option.textContent = `${id} - ${titel}`;
                    select.appendChild(option);
                });

                // aus "3 - Robotik" wieder die 3 extrahieren
                const aktuelleId = value.split(" - ")[0];
                select.value = aktuelleId;

                td.appendChild(select);
            }
            else {
                const input = document.createElement("input");
                input.type = fieldTypes[field] || "text";
                input.value = value;

                td.appendChild(input);
            }
        });
    }
}

viewBtn.onclick = () => {
    modus = "view";
    updateButtons();
};

editBtn.onclick = async () => {
    const {
        data: { user }
    } = await client.auth.getUser();

    if (!user) {
        alert("Nicht angemeldet.");
        return;
    }

    const { data: profileData, error } = await client
        .from("profile")
        .select("edit")
        .eq("uid", user.id)
        .single();

    if (error) {
        console.error(error);
        alert(error.message);
        return;
    }

    if (profileData.edit) {
        modus = "edit";
        updateButtons();
    } else {
        alert("Sie haben keine Berechtigung zum Bearbeiten.");
    }
};

newBtn.onclick = () => {
    const tbody = document.querySelector("#sus tbody");
    const rows = tbody.querySelectorAll("tr");

    let maxId = 0;

    rows.forEach(row => {
        const id = Number(row.querySelector('[data-field="id"]').textContent);
        if (id > maxId) {
            maxId = id;
        }
    });

    const neueId = maxId + 1;
    const tr = document.createElement("tr");
    tr.dataset.new = "true";

    tr.innerHTML = `
        <td data-field="id">${neueId}</td>
        <td data-field="klasse"><input type="text"></td>
        <td data-field="name"><input type="text"></td>
        <td data-field="mail"><input type="text"></td>
        <td data-field="zugeordnet">
        <td data-field="erstwunsch"><input type="text" value="0"></td>
        <td data-field="zweitwunsch"><input type="text"></td>
        <td data-field="drittwunsch"><input type="text"></td>
    `;

    tbody.appendChild(tr);
    
    const tdProjekt = tr.querySelector('[data-field="zugeordnet"]');
    const select = document.createElement("select");
    const leer = document.createElement("option");
    leer.value = "";
    leer.textContent = "";
    select.appendChild(leer);

    Object.entries(projekte).forEach(([id, titel]) => {
        const option = document.createElement("option");
        option.value = id;
        option.textContent = `${id} - ${titel}`;
        select.appendChild(option);
    });

    tdProjekt.appendChild(select);
};

saveBtn.onclick = async () => {
    if (modus !== "edit") return;

    if (!confirm("Sind Sie sich sicher, dass Sie die Änderungen hochladen und bisherige Projektdaten überschreiben wollen?")) {
        return;
    }

    const rows = document.querySelectorAll("#sus tbody tr");
    for (const row of rows) {
        const updateData = {};
        let id = null;

        row.querySelectorAll("td[data-field]").forEach(td => {
            const field = td.dataset.field;

            if (field === "id") {
                id = Number(td.textContent);
                return;
            }

            const feld = td.querySelector("input, select");
            let value = feld ? feld.value : td.textContent;

            // Zahlen umwandeln
            if (["zugeordnet"].includes(field)) {
                value = value === "" ? null : Number(value);
            }

            updateData[field] = value;
        });

        let error;
        if (row.dataset.new === "true") {

            updateData.id = id;

            ({ error } = await client
                .from("kat_sus")
                .insert(updateData));
        } 
        
        else {
            ({ error } = await client
                .from("kat_sus")
                .update(updateData)
                .eq("id", id));
        }

        if (error) {
            console.error(error);
            alert(`Fehler bei Sch&uuml;ler ${id}: ${error.message}`);
            return;
        }
    }

    modus = "view";
    updateButtons();

    alert("Alle Änderungen wurden gespeichert.");
};
updateButtons();

let projekte = {};

async function ladeProjekte() {
    const { data: projekteData, error } = await client
        .from("kat_projekte")
        .select("id, titel")
        .order("id");

    if (error) {
        console.error("Fehler beim Laden der Projekte:", error);
        return;
    }

    projekte = {};

    projekteData.forEach(p => {
        projekte[p.id] = p.titel;
    });
}

async function ladeSchueler(sortierung = "id") {
    const tbody = document.querySelector("#sus tbody");
    tbody.innerHTML = "";

    let query = client
        .from("kat_sus")
        .select(`
            id,
            klasse,
            name,
            mail,
            zugeordnet,
            erstwunsch,
            zweitwunsch,
            drittwunsch
        `)
        .order(sortierung);

    if (sortierung !== "name") {
        query = query.order("name");
    }

    const { data: schuelerData, error } = await query;

    if (error) {
        console.error("Fehler beim Laden der Schüler:", error);
        return;
    }

    schuelerData.forEach(s => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td data-field="id">${s.id ?? ""}</td>
            <td data-field="klasse">${s.klasse ?? ""}</td>
            <td data-field="name">${s.name ?? ""}</td>
            <td data-field="mail" class="mail" data-mail="${s.mail ?? ""}" title="Klicken zum Kopieren">${s.mail ?? ""}</td>
            <td data-field="zugeordnet">${s.zugeordnet ?? ""}${projekte[s.zugeordnet] ? " - " + projekte[s.zugeordnet] : ""}</td>
            <td data-field="erstwunsch">${s.erstwunsch ?? ""}</td>
            <td data-field="zweitwunsch">${s.zweitwunsch ?? ""}</td>
            <td data-field="drittwunsch">${s.drittwunsch ?? ""}</td>
        `;

        tbody.appendChild(tr);
        
        const zelle = tr.querySelector(".mail");
        zelle.style.cursor = "pointer";
        zelle.addEventListener("click", async () => {
            if (modus === "edit") return;

            const mail = zelle.dataset.mail;
            if (!mail) return;

            await navigator.clipboard.writeText(mail);

            zelle.textContent = "Kopiert ✓";
            zelle.title = "E-Mail wurde kopiert";

            setTimeout(() => {
                zelle.textContent = mail;
                zelle.title = "Klicken zum Kopieren";
            }, 3000);
        });
    });
}
ladeProjekte();
ladeSchueler();

document.querySelectorAll("#sus thead img").forEach(img => {
    img.addEventListener("click", () => {
        ladeSchueler(img.dataset.sort);
    });
});
</script>

        const loader = document.getElementById("loader");
        loader.style.display = "block";

        const { generate } = await import("https://esm.sh/@pdfme/generator");
        const { table, text } = await import("https://esm.sh/@pdfme/schemas");

        // Schueler laden
        const {
            data,
            error
        } = await client

            .from("kat_sus")
            .select(`
                id,
                klasse,
                name,
                mail,
                zugeordnet,
                erstwunsch,
                zweitwunsch,
                drittwunsch
            `)
            .order("id")
            .order("name");

        if(error){
            throw error;
        }        

        const {
            data: projekteData,
            error: projekteError
        } = await client
            .from("kat_projekte")
            .select("id, titel")
            .order("id");

        if (projekteError) {
            throw projekteError;
        }

        const projekte = {};

        projekteData.forEach(p => {
            projekte[String(p.id)] = p.titel;
        });

        // Tabellenzeilen erzeugen
        const tableRows = data.map(s => [
            kuerze(s.klasse, 10),
            kuerze(s.name, 20),
            kuerze(s.mail, 20),
            kuerze(
                `${s.zugeordnet ?? ""}${projekte[String(s.zugeordnet)] ? " - " + projekte[String(s.zugeordnet)] : ""}`,
                20
            )
        ]);

        console.log("Anzahl Schueler:", tableRows.length);

        // Template auswählen
        const templateName =
            tableRows.length > 33
                ? "../m/template_schueleruebersicht_2.json"
                : "../m/template_schueleruebersicht.json";

        console.log("Template:", templateName);
        const template = await fetch(templateName).then(r => r.json());

        // Tabellen aufteilen
        const table1 = tableRows.slice(0,33);
        const table2 = tableRows.slice(33);

        const datum =  new Date().toLocaleDateString("de-DE");
        const input = {
            header: `Schülerübersicht Klimaaktionstag, Stand: ${datum}`,
            table: table1
        };

        // Nur für template_2
        if(table2.length){
            input.table_2 = table2;
        }

        const pdf = await generate({
            template,
            inputs:[input],

            plugins:{
                table,
                text
            }
        });

        const blob =
            new Blob(
                [
                    pdf
                ],

                {
                    type: "application/pdf"
                }
            );

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");

        a.href = url;
        a.download = `kat_schueleruebersicht_${datum}.pdf`;

        a.click();
        URL.revokeObjectURL(url);
    }

    catch(error){
        console.error(error);
        alert(error.message);
    }

    finally{
        document.getElementById("loader").style.display = "none";
    }
}

let XLSX = null;
async function getXLSX() {
    if (!XLSX) {
        XLSX = await import("https://esm.sh/xlsx");
    }

    return XLSX;
}

async function downloadAsExcel() {
    await ladeSchueler();
    const XLSX = await getXLSX();
    const table = document.getElementById("sus");
    const workbook = XLSX.utils.table_to_book(table, {sheet: "Schueler"});
    const datum = new Date()
        .toLocaleDateString("de-DE")
        .replaceAll(".", "-");

    XLSX.writeFile(
        workbook,
        `kat_schueler_${datum}.xlsx`
    );
}

async function downloadAsOds() {
    await ladeSchueler();
    const XLSX = await getXLSX();
    const table = document.getElementById("sus");
    const workbook = XLSX.utils.table_to_book(table, {sheet: "Schueler"});
    const datum = new Date()
        .toLocaleDateString("de-DE")
        .replaceAll(".", "-");

    XLSX.writeFile(
        workbook,
        `kat_schueler_${datum}.ods`,
        {
            bookType: "ods"
        }
    );
}

window.downloadAsPdf = downloadAsPdf;
window.downloadAsOds = downloadAsOds;
window.downloadAsExcel = downloadAsExcel;
</script>
