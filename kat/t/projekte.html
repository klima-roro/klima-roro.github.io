async function loginCheck() {

async function checkOrga() {

const lightbox = document.getElementById("lightbox");
document.getElementById("openLightbox").onclick = () => {
    if (getComputedStyle(lightbox).display === "none") {
        lightbox.style.display = "block";
    }
}

lightbox.onclick = (e) => {
    if (e.target === lightbox) {
        lightbox.style.display = "none";
    }
}

    document.querySelector("main").style.display = "none";
    document.getElementById("mobile").style.display = "block";
}

document.getElementById("goYourWay").onclick = () => {
    document.querySelector("main").style.display = "block";
    document.getElementById("mobile").style.display = "none";
}

let modus = "view";

const viewBtn = document.getElementById("viewBtn");
const editBtn = document.getElementById("editBtn");
const newBtn = document.getElementById("new");
const saveBtn = document.getElementById("saveBtn");

const fieldTypes = {
    titel: "text",
    stufe_min: "number",
    stufe_max: "number",
    plaetze: "number",
    belegt: "number",
    frei: "number",
    durchfuerende: "text",
    lehrkraft: "text",
    ort: "text",
    startzeit: "time",
    endzeit: "time",
    materialien: "text",
    kontakt: "text"
};

function updateButtons() {
    if (modus === "view") {
        viewBtn.style.backgroundColor = "rgba(255,255,255,0.1)";
        editBtn.style.backgroundColor = "transparent";
        newBtn.style.display = "none";
        saveBtn.style.display = "none";

        document.querySelectorAll("#projekte tbody td[data-field]").forEach(td => {
            const field = td.dataset.field;
            if (["id", "belegt", "frei"].includes(field))
                return;

            const input = td.querySelector("input");

            if (input) {
                td.textContent = input.value;
            }
        });

    } else {
        viewBtn.style.backgroundColor = "transparent";
        editBtn.style.backgroundColor = "rgba(255,255,255,0.1)";
        newBtn.style.display = "block";
        saveBtn.style.display = "block";

        document.querySelectorAll("#projekte tbody td[data-field]").forEach(td => {
            const field = td.dataset.field;

            if (["id", "belegt", "frei"].includes(field))
                return;

            const value = td.textContent;
            td.innerHTML = "";
            const input = document.createElement("input");
            input.type = fieldTypes[field] || "text";
            input.value = value;

            td.appendChild(input);
        });
    }
}

viewBtn.onclick = () => {
    modus = "view";
    updateButtons();
};

editBtn.onclick = async () => {
    const {
        data: { user }
    } = await client.auth.getUser();

    if (!user) {
        alert("Nicht angemeldet.");
        return;
    }

    const { data, error } = await client
        .from("profile")
        .select("edit")
        .eq("uid", user.id)
        .single();

    if (error) {
        console.error(error);
        alert(error.message);
        return;
    }

    if (data.edit) {
        modus = "edit";
        updateButtons();
    } else {
        alert("Sie haben keine Berechtigung zum Bearbeiten.");
    }
};

newBtn.onclick = () => {
    const tbody = document.querySelector("#projekte tbody");
    const rows = tbody.querySelectorAll("tr");

    let maxId = 0;

    rows.forEach(row => {
        const id = Number(row.querySelector('[data-field="id"]').textContent);
        if (id > maxId) {
            maxId = id;
        }
    });

    const neueId = maxId + 1;
    const tr = document.createElement("tr");
    tr.dataset.new = "true";

    tr.innerHTML = `
        <td data-field="id">${neueId}</td>
        <td data-field="titel"><input type="text"></td>
        <td data-field="stufe_min"><input type="number"></td>
        <td data-field="stufe_max"><input type="number"></td>
        <td data-field="plaetze"><input type="number"></td>
        <td data-field="belegt"><input type="number" value="0"></td>
        <td data-field="frei"><input type="number"></td>
        <td data-field="durchfuerende"><input type="text"></td>
        <td data-field="lehrkraft"><input type="text"></td>
        <td data-field="ort"><input type="text"></td>
        <td data-field="startzeit"><input type="time"></td>
        <td data-field="endzeit"><input type="time"></td>
        <td data-field="materialien"><input type="text"></td>
        <td data-field="kontakt"><input type="text"></td>
    `;

    tbody.appendChild(tr);
};

saveBtn.onclick = async () => {
    if (modus !== "edit") return;

    if (!confirm("Sind Sie sich sicher, dass Sie die Änderungen hochladen und bisherige Schülerdaten überschreiben wollen?")) {
        return;
    }

    const rows = document.querySelectorAll("#projekte tbody tr");
    for (const row of rows) {
        const updateData = {};
        let id = null;

        row.querySelectorAll("td[data-field]").forEach(td => {
            const field = td.dataset.field;

            if (field === "id") {
                id = Number(td.textContent);
                return;
            }

            if (["belegt", "frei"].includes(field))
                return;

            const input = td.querySelector("input");
            let value = input ? input.value : td.textContent;

            // Zahlen umwandeln
            if (["stufe_min", "stufe_max", "plaetze", "belegt", "frei"].includes(field)) {
                value = value === "" ? null : Number(value);
            }

            updateData[field] = value;
        });

        let error;
        if (row.dataset.new === "true") {

            updateData.id = id;

            ({ error } = await client
                .from("kat_projekte")
                .insert(updateData));
        } 
        
        else {
            ({ error } = await client
                .from("kat_projekte")
                .update(updateData)
                .eq("id", id));
        }

        if (error) {
            console.error(error);
            alert(`Fehler bei Projekt ${id}: ${error.message}`);
            return;
        }
    }

    modus = "view";
    updateButtons();

    alert("Alle Änderungen wurden gespeichert.");
};
updateButtons();

async function ladeProjekte() {
    // Projekte laden
    const { data: projekte, error: projekteError } = await client
        .from("kat_projekte")
        .select("*")
        .order("id");

    if (projekteError) {
        console.error(projekteError);
        alert(projekteError.message);
        return;
    }

    // Schüler laden (nur Zuordnung)
    const { data: schueler, error: schuelerError } = await client
        .from("kat_sus")
        .select("zugeordnet");

    if (schuelerError) {
        console.error(schuelerError);
        alert(schuelerError.message);
        return;
    }

    // Anzahl belegter Plätze pro Projekt berechnen
    const belegt = {};

    schueler.forEach(s => {
        if (s.zugeordnet != null) {
            belegt[s.zugeordnet] = (belegt[s.zugeordnet] || 0) + 1;
        }
    });

    const tbody = document.querySelector("#projekte tbody");
    tbody.innerHTML = "";

    projekte.forEach(p => {

        const anzahlBelegt = belegt[p.id] || 0;
        const anzahlFrei = (p.plaetze || 0) - anzahlBelegt;

        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td data-field="id">${p.id}</td>
            <td data-field="titel">${p.titel ?? ""}</td>
            <td data-field="stufe_min">${p.stufe_min ?? ""}</td>
            <td data-field="stufe_max">${p.stufe_max ?? ""}</td>
            <td data-field="plaetze">${p.plaetze ?? ""}</td>
            <td data-field="belegt">${anzahlBelegt}</td>
            <td data-field="frei">${anzahlFrei}</td>
            <td data-field="durchfuerende">${p.durchfuerende ?? ""}</td>
            <td data-field="lehrkraft">${p.lehrkraft ?? ""}</td>
            <td data-field="ort">${p.ort ?? ""}</td>
            <td data-field="startzeit">${p.startzeit ? p.startzeit.slice(0,-3) : ""}</td>
            <td data-field="endzeit">${p.endzeit ? p.endzeit.slice(0,-3) : ""}</td>
            <td data-field="materialien">${p.materialien ?? ""}</td>
            <td data-field="kontakt">${p.kontakt ?? ""}</td>
        `;

        tbody.appendChild(tr);
    });
}
ladeProjekte();
</script>
<script type="module">
import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

const supabaseUrl = 'https://euuptkidjsquvhohvicv.supabase.co';
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1dXB0a2lkanNxdXZob2h2aWN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTUwMDk4OTksImV4cCI6MjA3MDU4NTg5OX0.O1isV0Ove_Tb1ruXqY_dlD4UdQGM174eVw9Kp_22YO4';

const client = createClient(

    supabaseKey,
    {
        auth:{
            persistSession:true
        }
    }
);

const downDrop = document.getElementById("downDrop"); // sweet
const openDownDrop = document.getElementById("openDownDrop");

openDownDrop.onclick = () => {
    if (downDrop.style.display === "none") {
        downDrop.style.display = "block";
    } else {
        downDrop.style.display = "none";
    }

}

document.getElementById("downDrop").addEventListener("change", function () {
    switch (this.value) {
        case "pdf": downloadAsPdf(); break;
        case "ods": downloadAsOds(); break;
        case "excel": downloadAsExcel(); break;
    }

    this.value = "";
});

async function downloadAsPdf() {
    await ladeProjekte();
    try{
        const loader = document.getElementById("loader");
        loader.style.display = "block";

        const { generate } = await import("https://esm.sh/@pdfme/generator");
        const { table, text } = await import("https://esm.sh/@pdfme/schemas");

        // Projekte laden
        const {
            data,
            error
        } = await client

            .from("kat_projekte")
            .select("id, titel, ort, lehrkraft")
            .order(
                "id",
                {
                    ascending:true
                }
            );

        if(error){
            throw error;
        }

        // Tabellenzeilen erzeugen
        const tableRows = data.map(row => [
            String(row.id ?? ""),
            row.titel ?? "",
            row.ort ?? "",
            row.lehrkraft ?? ""
        ]);

        console.log("Anzahl Projekte:", tableRows.length);

        // Template auswählen
        const templateName =
            tableRows.length > 33
                ? "../m/template_projektuebersicht_2.json"
                : "../m/template_projektuebersicht.json";

        console.log("Template:", templateName);
        const template = await fetch(templateName).then(r => r.json());

        // Tabellen aufteilen
        const table1 = tableRows.slice(0,33);
        const table2 = tableRows.slice(33);

        const datum =  new Date().toLocaleDateString("de-DE");
        const input = {
            header: `Projektübersicht Klimaaktionstag, Stand: ${datum}`,
            table: table1
        };

        // Nur für template_2
        if(table2.length){
            input.table_2 = table2;
        }

        const pdf = await generate({
            template,
            inputs:[input],

            plugins:{
                table,
                text
            }
        });

        const blob =
            new Blob(
                [
                    pdf
                ],

                {
                    type: "application/pdf"
                }
            );

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");

        a.href = url;
        a.download = `kat_projektuebersicht_${datum}.pdf`;

        a.click();
        URL.revokeObjectURL(url);
    }

    catch(error){
        console.error(error);
        alert(error.message);
    }

    finally{
        document.getElementById("loader").style.display = "none";
    }
}

let XLSX = null;
async function getXLSX() {
    if (!XLSX) {
        XLSX = await import("https://esm.sh/xlsx");
    }

    return XLSX;
}

async function downloadAsExcel() {
    await ladeProjekte();
    const XLSX = await getXLSX();
    const table = document.getElementById("projekte");
    const workbook = XLSX.utils.table_to_book(table, {sheet: "Projekte"});
    const datum = new Date()
        .toLocaleDateString("de-DE")
        .replaceAll(".", "-");

    XLSX.writeFile(
        workbook,
        `kat_projekte_${datum}.xlsx`
    );
}

async function downloadAsOds() {
    await ladeProjekte();
    const XLSX = await getXLSX();
    const table = document.getElementById("projekte");
    const workbook = XLSX.utils.table_to_book(table, {sheet: "Projekte"});
    const datum = new Date()
        .toLocaleDateString("de-DE")
        .replaceAll(".", "-");

    XLSX.writeFile(
        workbook,
        `kat_projekte_${datum}.ods`,
        {
            bookType: "ods"
        }
    );
}

window.downloadAsPdf = downloadAsPdf;
window.downloadAsOds = downloadAsOds;
window.downloadAsExcel = downloadAsExcel;
</script>
